[workspace]
name = "task4-scale-audit"
channels = ["conda-forge"]
platforms = ["osx-arm64"]
requires-pixi = ">=0.85"

[dependencies]
python = "3.13.*"
numpy = ">=2.2,<3"
pillow = ">=10"
bash = "*"
coreutils = "*"
curl = "*"
git = "*"
jq = "*"

[pypi-dependencies]
bpy = "==5.2.1"
aha3d = { git = "https://github.com/KevinXu02/aha-3d.git", rev = "82f4b1110cfe4b55fff19df3b3790852ce07b171" }

[activation.env]
PYTHONNOUSERSITE = "1"
